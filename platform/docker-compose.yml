services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: madrasa
      POSTGRES_USER: madrasa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U madrasa']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://madrasa:${POSTGRES_PASSWORD:-change-me}@db:5432/madrasa
      AUTO_MIGRATE: '1'
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      QR_TOKEN_SECRET: ${QR_TOKEN_SECRET:?set QR_TOKEN_SECRET}
      CRON_SECRET: ${CRON_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOADS_DIR: /app/data/uploads
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      JOBS_INLINE_WORKER: '1'
    volumes:
      - uploads:/app/data
    ports:
      - '3000:3000'
    restart: unless-stopped

  # يشغّل العامل والصيانة كل دقيقة (اختياري؛ العامل الداخلي يعمل داخل app أيضاً)
  cron:
    image: curlimages/curl:8.10.1
    depends_on:
      - app
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          curl -s -X POST -H "x-cron-secret: ${CRON_SECRET:-}" http://app:3000/api/v1/jobs/run >/dev/null || true
          sleep 60
        done
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
