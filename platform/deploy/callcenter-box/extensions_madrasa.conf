; Asterisk dialplan لمركز الاتصال (مدرسة) — مسودة المرحلة 0، تُختبر مع الجهاز.
; التسجيلات بصوت المالك في /var/lib/asterisk/sounds/madrasa/ بأسماء النصوص: SUSPENDED، HOME_STUCK، CONFIRM_SPECIAL، menu، beep_after، thanks
; (wav 8kHz mono أو gsm). أضف إلى extensions.conf:  #include extensions_madrasa.conf

[madrasa-out]
; مكالمة صادرة: يشغّل نص المهمة ويقرأ زرًا واحدًا (3 محاولات)، ثم يرسل النتيجة إلى الوكيل
exten => s,1,Answer()
 same => n,Set(CC_START=${EPOCH})
 same => n,Set(CC_DIGIT=)
 same => n,Set(TRY=0)
 same => n(again),Read(CC_DIGIT,madrasa/${CC_SCRIPT},1,,1,6)
 same => n,GotoIf($["${CC_DIGIT}" != "" & $["${CC_DIGITS}" : ".*${CC_DIGIT}.*"] > 0]?ok)
 same => n,Set(TRY=$[${TRY} + 1])
 same => n,GotoIf($[${TRY} < 3]?again)
 same => n,Set(CC_DIGIT=)
 same => n(ok),Playback(madrasa/thanks)
 same => n,Hangup()
exten => h,1,UserEvent(ccresult,Task: ${CC_TASK},Digit: ${CC_DIGIT},Duration: $[${EPOCH} - ${CC_START}])

[madrasa-in]
; مكالمة واردة على الرقم الرسمي (الشريحة 4): القائمة، ثم رسالة بعد الصفارة
exten => s,1,Answer()
 same => n,Set(CC_START=${EPOCH})
 same => n,Set(CC_CHOICE=)
 same => n,Set(CC_FILE=/var/spool/madrasa/${UNIQUEID}.wav)
 same => n,Read(CC_CHOICE,madrasa/menu,1,,2,8)
 same => n,Playback(madrasa/beep_after)
 same => n,Record(${CC_FILE},3,120,q)
 same => n,Playback(madrasa/thanks)
 same => n,Hangup()
exten => h,1,System(/opt/madrasa-box/inbound.py ${CALLERID(num)} ${CC_CHOICE} ${CC_FILE} $[${EPOCH} - ${CC_START}] 4 &)
