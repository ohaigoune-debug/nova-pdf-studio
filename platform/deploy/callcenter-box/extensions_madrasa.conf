; Asterisk dialplan لمركز الاتصال (مدرسة). يثبّته install.sh في /etc/asterisk/ ويُضمَّن من extensions.conf.
; التسجيلات بصوت المالك في /var/lib/madrasa-box/sounds/ (wav 8kHz mono، يصنعها: sudo madrasa-box record):
;   SUSPENDED، HOME_STUCK، CONFIRM_SPECIAL، menu، beep_after، thanks

[madrasa-out]
; مكالمة صادرة: يشغّل نص المهمة ويقرأ زرًا واحدًا (3 محاولات)، ثم يرسل النتيجة إلى الوكيل
exten => s,1,Answer()
 same => n,Set(CC_START=${EPOCH})
 same => n,Set(CC_DIGIT=)
 same => n,Set(TRY=0)
 same => n,Wait(1)
 same => n(again),Read(CC_DIGIT,/var/lib/madrasa-box/sounds/${CC_SCRIPT},1,,1,6)
 same => n,GotoIf($["${CC_DIGIT}" != "" & $["${CC_DIGITS}" : ".*${CC_DIGIT}.*"] > 0]?ok)
 same => n,Set(TRY=$[${TRY} + 1])
 same => n,GotoIf($[${TRY} < 3]?again)
 same => n,Set(CC_DIGIT=)
 same => n(ok),Playback(/var/lib/madrasa-box/sounds/thanks)
 same => n,Hangup()
exten => h,1,UserEvent(ccresult,Task: ${CC_TASK},Digit: ${CC_DIGIT},Duration: $[${EPOCH} - ${CC_START}])

[madrasa-from-gw]
; كل ما يصل من TG400L. في الجهاز (Mobile to IP) اجعل رقم الوجهة لكل منفذ 900N:
; 9001 للمنفذ 1 … 9004 للمنفذ 4، فيُعرف من أي شريحة جاءت المكالمة (ردّ على مكالمة صادرة، أو الرقم الرسمي).
exten => _900[1-8],1,Set(CC_SIM=${EXTEN:3})
 same => n,Goto(madrasa-in,s,1)
exten => _X.,1,Set(CC_SIM=)
 same => n,Goto(madrasa-in,s,1)
exten => s,1,Set(CC_SIM=)
 same => n,Goto(madrasa-in,s,1)

[madrasa-in]
; مكالمة واردة: القائمة، ثم رسالة بعد الصفارة (حتى دقيقتين)، ثم ترسل إلى المنصة مع التسجيل
exten => s,1,Answer()
 same => n,Set(CC_START=${EPOCH})
 same => n,Set(CC_CHOICE=)
 same => n,Set(CC_FILE=/var/spool/madrasa/${UNIQUEID}.wav)
 same => n,Wait(1)
 same => n,Read(CC_CHOICE,/var/lib/madrasa-box/sounds/menu,1,,2,8)
 same => n,Playback(/var/lib/madrasa-box/sounds/beep_after)
 same => n,Record(${CC_FILE},3,120,qk)
 same => n,Playback(/var/lib/madrasa-box/sounds/thanks)
 same => n,Hangup()
; FILTER: لا يصل إلى الصدفة إلا أرقام (رقم المتصل يأتي من الشبكة)
exten => h,1,System(/opt/madrasa-box/inbound.py "${FILTER(0-9+,${CALLERID(num)})}" "${FILTER(0-9,${CC_CHOICE})}" "${FILTER(0-9a-z/.,${CC_FILE})}" "$[${EPOCH} - ${CC_START}]" "${FILTER(0-9,${CC_SIM})}" >> /var/log/madrasa-box/inbound.log 2>&1 &)
