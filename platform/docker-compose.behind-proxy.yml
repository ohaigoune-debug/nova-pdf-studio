# للخوادم التي يعمل عليها خادم ويب بالفعل (nginx/Apache/Caddy/لوحة تحكّم).
# يُلغي Caddy الخاص بنا ويُخرج التطبيق على 127.0.0.1:3000 فقط، ليمرّره خادمك الموجود.
# المنفذ محصور بالعنوان المحلّي: لا يُرى من الإنترنت، فلا يتجاوز أحد خادمك الأمامي.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.behind-proxy.yml \
#     up -d --build --scale caddy=0
#
# ثم أضف في خادمك الأمامي موقعاً لـ madrasadz.com يمرّر إلى http://127.0.0.1:3000
# مع تمرير X-Forwarded-For (المنصة تعتمد عليه للحدّ من المحاولات لكل IP).
services:
  app:
    ports:
      - '127.0.0.1:3000:3000'
