plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

/*
 * تطبيق «مدرسة» الأصيل: لا صفحات ويب — يكلّم واجهة JSON نفسها التي يستعملها تطبيق الآيفون
 * (/api/v1/ios/*) ويعمل دون إنترنت لما حُفظ على الهاتف.
 *
 * التوقيع: من متغيّرات البيئة أو android-native/keystore.properties (لا يُرفع أبدًا إلى GitHub).
 * بلا مفتاح يُبنى ملف الإصدار غير موقّع، وبناء debug يعمل دائمًا للتجربة.
 */
def appId = project.property('madrasaAppId')

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
def storePath = System.getenv('ANDROID_KEYSTORE_PATH') ?: keystoreProperties.getProperty('storeFile')
def storePass = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: keystoreProperties.getProperty('storePassword')
def keyAliasName = System.getenv('ANDROID_KEY_ALIAS') ?: keystoreProperties.getProperty('keyAlias')
def keyPass = System.getenv('ANDROID_KEY_PASSWORD') ?: keystoreProperties.getProperty('keyPassword')
def hasSigning = storePath != null && file(storePath).exists() && storePass != null && keyAliasName != null

android {
    namespace 'dz.madrasa.app'
    compileSdk 36

    defaultConfig {
        applicationId appId
        minSdk 24
        targetSdk 36
        versionCode project.property('madrasaVersionCode').toInteger()
        versionName project.property('madrasaVersionName')
        buildConfigField 'String', 'BASE_URL', '"https://madrasadz.com"'
        resourceConfigurations += ['ar', 'fr', 'en']
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile file(storePath)
                storePassword storePass
                keyAlias keyAliasName
                keyPassword keyPass ?: storePass
            }
        }
    }

    buildTypes {
        debug {
            // نسخة التجربة تُثبَّت بجانب نسخة المتجر ولا تحلّ محلّها
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/*.kotlin_module']
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        checkReleaseBuilds false
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.01.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.0'
}

tasks.register('printSigningReady') {
    doLast { println hasSigning ? "signing: ready" : 'signing: NOT configured — release will be unsigned' }
}
