# NOVA Docs (iOS) — اختبارات الويب + بناء Xcode حقيقي على macOS + لقطات من محاكي iPhone/iPad.
# لا يوقّع ولا يرفع شيئًا إلى Apple (انظر nova-docs-testflight.yml للرفع اليدوي إلى TestFlight).
name: NOVA Docs iOS

on:
  push:
    branches: [feature/nova-docs-ios]
    paths: ['apps/nova-docs/**', 'src/shared/**', 'src/modules/**', 'resources/**', '.github/workflows/nova-docs-ios.yml']
  pull_request:
    paths: ['apps/nova-docs/**', 'src/shared/**', 'src/modules/**']
  workflow_dispatch:

concurrency:
  group: nova-docs-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck · unit tests · OCR accuracy · Windows untouched
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Windows app — install & checks (must stay green)
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
      - name: iOS app — install
        working-directory: apps/nova-docs
        run: npm ci --no-audit --no-fund
      - name: iOS app — typecheck, tests, build
        working-directory: apps/nova-docs
        run: |
          npm run typecheck
          npx vitest run --reporter=default --reporter=github-actions
          node scripts/copy-assets.mjs
          npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-accuracy
          path: apps/nova-docs/test-results/

  ios:
    name: Xcode build (simulator) + screenshots
    runs-on: macos-15
    needs: web
    timeout-minutes: 60
    permissions:
      contents: write   # لنشر نتائج البناء واللقطات في فرع ci/nova-docs-ios-results للمراجعة
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Install & build web app
        working-directory: apps/nova-docs
        run: |
          npm ci --no-audit --no-fund
          node scripts/copy-assets.mjs
          npm run build
          npx cap sync ios
          python3 scripts/patch-xcode-project.py
      - name: xcodebuild (iphonesimulator, no signing)
        working-directory: apps/nova-docs/ios/App
        run: |
          set +e
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1
          code=$?
          tail -60 xcodebuild.log
          grep -E "error:|\*\* BUILD" xcodebuild.log | sort -u | head -60 > xcode-errors.txt
          if [ $code -ne 0 ]; then
            grep -E "error:" xcodebuild.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit $code
          fi
      - name: Release build (device, unsigned) — compiles optimized Swift
        working-directory: apps/nova-docs/ios/App
        run: |
          set +e
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > xcodebuild-release.log 2>&1
          code=$?
          tail -30 xcodebuild-release.log
          if [ $code -ne 0 ]; then
            grep -E "error:" xcodebuild-release.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit $code
          fi
      - name: Simulator screenshots (iPhone 6.9" + iPad 13") — real iOS runtime
        working-directory: apps/nova-docs/ios/App
        run: |
          mkdir -p shots
          APP=$(find build/Build/Products -name 'App.app' -path '*iphonesimulator*' | head -1)
          # NOVA_ROUTE (نسخة Debug فقط) يفتح الشاشة المطلوبة داخل التطبيق دون نافذة تأكيد الروابط
          SCENES="01-annotated|lang/en,theme/light,annotated
          02-documents|tab/documents
          03-tools|tab/tools
          04-scan|tab/scan
          05-invoices|demo-invoices
          06-invoice|invoice
          07-pro|paywall
          08-ar-documents|lang/ar,tab/documents
          09-ar-invoices|lang/ar,demo-invoices
          10-ar-dark-tools|lang/ar,theme/dark,tab/tools
          11-ocr-selftest|lang/en,theme/light,ocr-selftest|45
          12-invoice-pdf|lang/en,theme/light,invoice-pdf-selftest|30
          13-scan-review|lang/en,theme/light,scan-demo|20
          14-ar-scan-review|lang/ar,theme/light,scan-demo|20
          15-settings|lang/en,theme/light,settings|14
          16-filter-timing|lang/en,theme/light,filter-timing|25
          17-ar-merge-sheet|lang/ar,theme/dark,tool/merge|14
          18-fonts|lang/ar,theme/light,fonts-selftest|35
          19-ar-invoices-seller|lang/ar,theme/light,tab/invoices|14"
          for DEV in "iPhone 16 Pro Max" "iPad Pro 13-inch (M4)"; do
            UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((x['udid'] for v in d.values() for x in v if x['name']=='$DEV'), ''))")
            if [ -z "$UDID" ]; then echo "::warning::no simulator $DEV"; continue; fi
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
            xcrun simctl install "$UDID" "$APP"
            SLUG=$(echo "$DEV" | tr ' ()"' '____')
            echo "$SCENES" | while IFS='|' read -r NAME ROUTE WAIT; do
              NAME=$(echo "$NAME" | xargs)
              xcrun simctl terminate "$UDID" com.haigoune.novadocs 2>/dev/null || true
              SIMCTL_CHILD_NOVA_ROUTE="$ROUTE" xcrun simctl launch --terminate-running-process --stdout="$PWD/shots/${SLUG}-${NAME}-stdout.txt" --stderr="$PWD/shots/${SLUG}-${NAME}-stderr.txt" "$UDID" com.haigoune.novadocs
              sleep "${WAIT:-14}"
              xcrun simctl io "$UDID" screenshot "shots/${SLUG}-${NAME}.png"
            done
            xcrun simctl spawn "$UDID" log show --last 5m --predicate 'process == "App"' --style compact 2>/dev/null | grep -iE "error|nova|capacitor" | tail -80 > "shots/${SLUG}-app-log.txt" || true
            xcrun simctl shutdown "$UDID" || true
          done
          ls -la shots
      - name: StoreKit purchase tests — Apple StoreKit Testing (local; no Apple account, no real payment)
        working-directory: apps/nova-docs/ios/App
        run: |
          set +e
          xcodebuild test -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > storekit-tests.log 2>&1
          code=$?
          grep -E "Test Case .*(passed|failed)|error:|\*\* TEST|Executed [0-9]+ test" storekit-tests.log | sort -u | tee storekit-tests-summary.txt
          if [ $code -ne 0 ]; then
            tail -80 storekit-tests.log
            grep -E "error:|failed" storekit-tests.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit $code
          fi
      - name: Publish results to branch ci/nova-docs-ios-results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          R=/tmp/ci-results; rm -rf $R; mkdir -p $R
          cd apps/nova-docs/ios/App
          cp -r shots $R/ 2>/dev/null || true
          cp xcode-errors.txt $R/ 2>/dev/null || true
          [ -f xcodebuild.log ] && tail -400 xcodebuild.log > $R/xcodebuild-tail.log
          [ -f xcodebuild-release.log ] && tail -200 xcodebuild-release.log > $R/xcodebuild-release-tail.log
          cp storekit-tests-summary.txt $R/ 2>/dev/null || true
          [ -f storekit-tests.log ] && tail -300 storekit-tests.log > $R/storekit-tests-tail.log
          xcodebuild -version > $R/xcode-version.txt 2>&1 || true
          echo "${GITHUB_SHA} ${{ job.status }}" > $R/RESULT.txt
          cd $R && git init -q && git checkout -q -b ci/nova-docs-ios-results && git add -A
          git -c user.name="nova-ci" -c user.email="nova-ci@users.noreply.github.com" commit -qm "iOS CI results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/nova-docs-ios-results || echo "::warning::could not publish results branch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: |
            apps/nova-docs/ios/App/xcodebuild.log
            apps/nova-docs/ios/App/shots/
