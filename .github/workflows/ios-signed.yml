name: iOS — signed IPA
# Revision 3: export the Build 2 native checking/navigation repair for validation.
# Uses the existing owner-approved signing inputs; does not upload to Apple.

on:
  workflow_dispatch:
  push:
    branches: [codex/ios-app-foundation]
    paths: ['.github/workflows/ios-signed.yml']

permissions:
  contents: read

concurrency:
  group: ios-signed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    if: github.repository == 'ohaigoune-debug/nova-pdf-studio' && github.ref == 'refs/heads/codex/ios-app-foundation' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive, sign and export IPA without uploading to Apple
        env:
          MADRASADZ_IOS_P12_BASE64: ${{ secrets.MADRASADZ_IOS_P12_BASE64 }}
          MADRASADZ_IOS_P12_PASSWORD: ${{ secrets.MADRASADZ_IOS_P12_PASSWORD }}
          MADRASADZ_IOS_PROFILE_BASE64: ${{ secrets.MADRASADZ_IOS_PROFILE_BASE64 }}
        run: bash platform/ios/scripts/build-signed.sh
      - name: Keep the signed IPA for the next upload step
        uses: actions/upload-artifact@v4
        with:
          name: Madrasadz-signed-IPA-${{ github.sha }}
          path: platform/ios/build/Signed/IPA/*.ipa
          if-no-files-found: error
          retention-days: 1

# No Apple API key, TestFlight upload, App Review submission or production deployment.
