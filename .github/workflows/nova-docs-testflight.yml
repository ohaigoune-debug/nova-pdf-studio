# رفع إلى TestFlight فقط (لا يرسل للمراجعة العامة ولا يطلق المبيعات).
# يتطلب أسرار المستودع (Settings → Secrets and variables → Actions، لا تُكتب في الشيفرة أبدًا):
#   APPLE_TEAM_ID            معرّف الفريق في Apple Developer (Membership details → Team ID)
#   ASC_KEY_ID               App Store Connect API Key ID — **دور Admin** (التوقيع السحابي للتوزيع يرفض App Manager)
#   ASC_ISSUER_ID            Issuer ID (يظهر فوق قائمة المفاتيح)
#   ASC_KEY_P8               محتوى ملف AuthKey_XXXX.p8 كما هو (افتحه بالمفكرة وانسخ كل الأسطر) — أو بديلًا عنه:
#   ASC_KEY_P8_BASE64        المحتوى نفسه بترميز base64
#   NOVA_SUPPORT_EMAIL       (اختياري) بريد الدعم المعروض داخل التطبيق
# التشغيل: إيداع على feature/nova-docs-ios رسالته تحوي [testflight]، أو وسم nova-docs-testflight-*، أو Run workflow من main.
name: NOVA Docs → TestFlight (manual)

on:
  push:
    branches: [feature/nova-docs-ios]
    tags: ['nova-docs-testflight-*']
  workflow_dispatch:
    inputs:
      build_number:
        description: 'CFBundleVersion (يجب أن يزيد في كل رفع؛ فارغ = رقم التشغيل)'
        required: false
        default: ''

jobs:
  testflight:
    # يعمل على push فقط إذا احتوت رسالة الإيداع على [testflight] (بيئة العمل لا تستطيع دفع الوسوم)، أو بوسم، أو يدويًا
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[testflight]') || contains(github.event.head_commit.message, '[testflight-tester]')
    runs-on: macos-15
    timeout-minutes: 60
    environment: apple-release
    env:
      # [testflight-tester]: بناء اختبار داخلي — Pro مفتوح دون شراء (شرط التجميع NOVA_TESTER_PRO)، بإصدار 0.9.0
      # كي لا يمكن اختياره عند تقديم الإصدار 1.0 للمراجعة. البناءات العادية لا تحمل هذا الشرط أبدًا.
      TESTER_BUILD: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[testflight-tester]') && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8_RAW: ${{ secrets.ASC_KEY_P8 }}
          P8_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=""
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$P8_RAW" ] && [ -z "$P8_B64" ] && missing="$missing ASC_KEY_P8(or ASC_KEY_P8_BASE64)"
          if [ -n "$missing" ]; then echo "::error::Missing Apple secrets:$missing"; exit 1; fi
          if [ -n "$P8_RAW" ]; then
            printf '%s\n' "$P8_RAW" | grep -q "BEGIN PRIVATE KEY" || { echo "::error::ASC_KEY_P8 must be the full text of the .p8 file (starts with -----BEGIN PRIVATE KEY-----)"; exit 1; }
          else
            echo "$P8_B64" | base64 --decode 2>/dev/null | grep -q "BEGIN PRIVATE KEY" || { echo "::error::ASC_KEY_P8_BASE64 is not a base64-encoded .p8 key"; exit 1; }
          fi
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build web app & sync
        working-directory: apps/nova-docs
        env:
          NOVA_BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
          VITE_SUPPORT_EMAIL: ${{ secrets.NOVA_SUPPORT_EMAIL }}
        run: |
          npm ci --no-audit --no-fund
          node scripts/copy-assets.mjs
          npm run build
          npx cap sync ios
          python3 scripts/patch-xcode-project.py
      - name: Archive (unsigned) & export with cloud signing → upload to App Store Connect (TestFlight)
        working-directory: apps/nova-docs/ios/App
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOVA_BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
        run: |
          set -o pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          if [ -n "$ASC_KEY_P8" ]; then printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          else echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8; fi
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          # أرشفة غير موقّعة (لا جهاز مسجّل في الحساب لملف «تطوير»)؛ التوقيع Apple Distribution + ملف App Store عند التصدير —
          # الطريقة نفسها التي نجحت في اختبار التوقيع (nova-docs-sign-test.yml، التشغيل 2)
          EXTRA=()
          if [ "$TESTER_BUILD" = "1" ]; then
            EXTRA=(MARKETING_VERSION=0.9.0 'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) NOVA_TESTER_PRO')
            echo "::warning::Internal tester build: Pro unlocked without purchase, version 0.9.0 — never submit this build for review"
          fi
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/NovaDocs.xcarchive DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" "${EXTRA[@]}" archive > archive.log 2>&1 \
            || { tail -80 archive.log; grep -E "error:|Error Domain|No profiles|signing" archive.log | sort -u | head -30 | while IFS= read -r l; do echo "::error::${l:0:900}"; done; exit 1; }
          tail -15 archive.log
          V=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' build/NovaDocs.xcarchive/Info.plist)
          echo "Archived version: $V"
          if [ "$TESTER_BUILD" = "1" ] && [ "$V" != "0.9.0" ]; then echo "::error::Tester build must be 0.9.0, got $V"; exit 1; fi
          if [ "$TESTER_BUILD" != "1" ] && [ "$V" = "0.9.0" ]; then echo "::error::Release build must not be 0.9.0"; exit 1; fi
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/NovaDocs.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/export $AUTH > export.log 2>&1 \
            || { tail -80 export.log; grep -E "error:|Error Domain|permission|ITMS-" export.log | sort -u | head -30 | while IFS= read -r l; do echo "::error::${l:0:900}"; done; rm -f ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8; exit 1; }
          tail -25 export.log
          grep -q "Upload succeeded\|EXPORT SUCCEEDED" export.log && echo "::notice::Uploaded to App Store Connect — version $V build ${NOVA_BUILD_NUMBER:-?}${TESTER_BUILD:+ (INTERNAL TESTER BUILD — Pro unlocked, do not submit)} — processing in TestFlight takes ~10–30 min"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
