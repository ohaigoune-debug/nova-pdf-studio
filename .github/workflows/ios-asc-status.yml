name: iOS — App Store Connect status / App Review submission (manual release)

# [asc-status]: read-only check of Madrasadz 1.1.0 (versions, review details, age-rating gaps, Build 19).
# Uses the owner's App Manager key (MADRASADZ_ASC_MANAGER_*, added 23 Nov 2026).
# [asc-submit]: owner-approved App Review submission («ارسله للمراجعة», 23 Nov 2026) — release stays MANUAL.
# Trigger: a commit on claude/ios-build19-sign whose message contains [asc-status].
on:
  push:
    branches: [claude/ios-build19-sign]

permissions:
  contents: read

jobs:
  asc:
    if: github.repository == 'ohaigoune-debug/nova-pdf-studio' && (contains(github.event.head_commit.message, '[asc-status]') || contains(github.event.head_commit.message, '[asc-submit]'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyjwt cryptography
      - name: Prepare key
        env:
          MANAGER_KEY_BASE64: ${{ secrets.MADRASADZ_ASC_MANAGER_KEY_BASE64 }}
        run: |
          umask 077
          [ -n "$MANAGER_KEY_BASE64" ] || { echo "::error::secret MADRASADZ_ASC_MANAGER_KEY_BASE64 is empty or missing"; exit 1; }
          printf '%s' "$MANAGER_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/asc.p8" 2>/dev/null || printf '%s\n' "$MANAGER_KEY_BASE64" > "$RUNNER_TEMP/asc.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/asc.p8" || { echo "::error::Key is not a .p8 private key"; exit 1; }
      - name: App Store Connect status
        env:
          ASC_KEY_ID: ${{ secrets.MADRASADZ_ASC_MANAGER_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.MADRASADZ_ASC_MANAGER_ISSUER_ID }}
          BUNDLE_ID: com.madrasadz.student
          VERSION: 1.1.0
          MODE: ${{ contains(github.event.head_commit.message, '[asc-submit]') && 'submit' || 'status' }}
        run: KEY_PATH="$RUNNER_TEMP/asc.p8" python3 platform/ios/scripts/asc_review.py
      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
