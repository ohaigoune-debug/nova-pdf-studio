name: أندرويد — التطبيق الأصيل (فحص وبناء)

# يُفحص ويُبنى التطبيق الأصيل مع كل دفعة على فرعه. لا مفاتيح توقيع هنا أبدًا:
# يخرج APK تجريبي (dz.madrasa.app.debug، يُثبَّت بجانب نسخة المتجر) وملف AAB غير موقّع للتحقق فقط.
# الملف الموقّع للمتجر يُبنى على الخادم بمفتاح المالك (platform/android-native/scripts/build-aab-on-server.sh).
on:
  push:
    branches: [android-parity]
    paths:
      - 'platform/android-native/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: platform/android-native

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: اختبارات التصحيح (مطابقة الخادم وتطبيق الآيفون)
        run: chmod +x gradlew && ./gradlew --no-daemon --console=plain testDebugUnitTest

      - name: بناء النسخة التجريبية وملف الإصدار غير الموقّع
        run: ./gradlew --no-daemon --console=plain assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madrasa-android-native
          path: |
            platform/android-native/app/build/outputs/apk/debug/*.apk
            platform/android-native/app/build/outputs/bundle/release/*.aab
            platform/android-native/app/build/reports/tests/
          if-no-files-found: warn

  screens:
    # جولة على كل الشاشات في محاكي أندرويد، بلقطات للمراجعة البصرية (خادم تجريبي في نسخة debug فقط)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: تفعيل KVM للمحاكي
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: بناء نسختي التجربة
        run: chmod +x gradlew && ./gradlew --no-daemon --console=plain assembleDebug assembleDebugAndroidTest

      - name: الجولة على المحاكي
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: platform/android-native
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class dz.madrasa.app.ScreensTour dz.madrasa.app.debug.test/androidx.test.runner.AndroidJUnitRunner || true
            mkdir -p shots && adb pull /sdcard/Android/data/dz.madrasa.app.debug/files/shots shots/ || true
            adb logcat -d -t 400 > shots/logcat.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madrasa-android-screens
          path: platform/android-native/shots/
          if-no-files-found: warn
