name: NOVA Docs → App Store metadata (no submission)

# يرفع نصوص صفحة المتجر (en/fr/ar) واللقطات المعتمدة (docs/ios/screenshots) إلى إصدار 1.0.0 في App Store Connect.
# لا يرفع بناءً، ولا يقدّم شيئًا للمراجعة. التشغيل: إيداع على الفرع رسالته تحوي [appstore-metadata].
on:
  push:
    branches: [feature/nova-docs-ios]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[appstore-metadata]')
    runs-on: ubuntu-latest
    environment: apple-release
    defaults:
      run:
        working-directory: apps/nova-docs
    steps:
      - uses: actions/checkout@v4
      - name: Check inputs
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SUPPORT_EMAIL: ${{ secrets.NOVA_SUPPORT_EMAIL }}
          REVIEW_PHONE: ${{ secrets.NOVA_REVIEW_PHONE }}
          REVIEW_FIRST_NAME: ${{ secrets.NOVA_REVIEW_FIRST_NAME }}
          REVIEW_LAST_NAME: ${{ secrets.NOVA_REVIEW_LAST_NAME }}
        run: |
          [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] || { echo "::error::ASC_KEY_ID / ASC_ISSUER_ID missing"; exit 1; }
          [ -n "$ASC_KEY_P8" ] || [ -n "$ASC_KEY_P8_BASE64" ] || { echo "::error::ASC_KEY_P8 missing"; exit 1; }
          for v in SUPPORT_EMAIL REVIEW_PHONE REVIEW_FIRST_NAME REVIEW_LAST_NAME; do [ -n "${!v}" ] || echo "::warning::$v not set — fill App Review contact on the web"; done
          n6=$(ls ../../docs/ios/screenshots/iphone-6.9/*.png | wc -l); n13=$(ls ../../docs/ios/screenshots/ipad-13/*.png | wc -l)
          echo "screenshots: iPhone 6.9 = $n6, iPad 13 = $n13"
          [ "$n6" -ge 3 ] && [ "$n6" -le 10 ] && [ "$n13" -ge 3 ] && [ "$n13" -le 10 ] || { echo "::error::Need 3–10 screenshots per device"; exit 1; }
      - name: Prepare key and screenshots
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077
          if [ -n "$ASC_KEY_P8" ]; then printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"; else printf '%s' "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/asc.p8"; fi
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/asc.p8" || { echo "::error::Key is not a .p8 private key"; exit 1; }
          for loc in en-US fr-FR ar-SA; do
            mkdir -p "$RUNNER_TEMP/shots/$loc"
            cp ../../docs/ios/screenshots/iphone-6.9/*.png ../../docs/ios/screenshots/ipad-13/*.png "$RUNNER_TEMP/shots/$loc/"
          done
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install fastlane
        run: gem install fastlane -N --quiet && fastlane --version | tail -1
      - name: Upload metadata and screenshots (no build, no submission)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SUPPORT_EMAIL: ${{ secrets.NOVA_SUPPORT_EMAIL }}
          REVIEW_PHONE: ${{ secrets.NOVA_REVIEW_PHONE }}
          REVIEW_FIRST_NAME: ${{ secrets.NOVA_REVIEW_FIRST_NAME }}
          REVIEW_LAST_NAME: ${{ secrets.NOVA_REVIEW_LAST_NAME }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_TIMESTAMP: '1'
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/asc.p8" SCREENSHOTS_PATH="$RUNNER_TEMP/shots"
          fastlane metadata > "$RUNNER_TEMP/deliver.log" 2>&1 || { grep -E "\[!\]|ERROR|Error|error" "$RUNNER_TEMP/deliver.log" | grep -v -i "key\b" | head -40 | sed 's/^/::error::/'; exit 1; }
          grep -E "Successfully uploaded|Uploading|screenshots" "$RUNNER_TEMP/deliver.log" | tail -15
          echo "::notice::App Store metadata and screenshots uploaded to version 1.0.0 (not submitted)"
      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
