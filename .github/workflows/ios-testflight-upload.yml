name: iOS — Build 11 TestFlight upload

on:
  workflow_dispatch:
  push:
    branches: [codex/ios-app-foundation]
    paths: ['.github/workflows/ios-testflight-upload.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-testflight-build-11-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'ohaigoune-debug/nova-pdf-studio' && (github.ref == 'refs/heads/codex/ios-app-foundation' || github.ref == 'refs/heads/claude/native-ios-full') && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the owner-approved successful signed IPA
        uses: actions/download-artifact@v4
        with:
          name: Madrasadz-signed-IPA-78bd0881a6bc56b93c995fdd2f1e484a517c7b73
          run-id: 41600475246
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/madrasadz-approved-ipa
      - name: Validate and upload Build 11 to Apple
        env:
          MADRASADZ_ASC_PRIVATE_KEY_BASE64: ${{ secrets.MADRASADZ_ASC_PRIVATE_KEY_BASE64 }}
          MADRASADZ_ASC_KEY_ID: ${{ secrets.MADRASADZ_ASC_KEY_ID }}
          MADRASADZ_ASC_ISSUER_ID: ${{ secrets.MADRASADZ_ASC_ISSUER_ID }}
        run: bash platform/ios/scripts/upload-testflight.sh "$RUNNER_TEMP/madrasadz-approved-ipa/Madrasadz.ipa"

# Owner-approved internal replacement (3 Nov 2026). Pinned signed Build 11 (signed run
# 41600475246 on 78bd088): course lessons with video + PDF, appearance choice, clear
# PLAY trial state. Same source passed ios-native-check.yml run 41598225376 (core
# package, Debug/Release, native UI tests). Owner-only internal group; no new
# invitation, App Review submission or release.
