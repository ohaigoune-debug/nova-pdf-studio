name: iOS — Build 7 TestFlight upload

on:
  workflow_dispatch:
  push:
    branches: [codex/ios-app-foundation]
    paths: ['.github/workflows/ios-testflight-upload.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-testflight-build-7-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'ohaigoune-debug/nova-pdf-studio' && github.ref == 'refs/heads/codex/ios-app-foundation' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the owner-approved successful signed IPA
        uses: actions/download-artifact@v4
        with:
          name: Madrasadz-signed-IPA-deb03f622ac84346c690a7da611f46d7d62ec194
          run-id: 40525444553
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/madrasadz-approved-ipa
      - name: Validate and upload Build 7 to Apple
        env:
          MADRASADZ_ASC_PRIVATE_KEY_BASE64: ${{ secrets.MADRASADZ_ASC_PRIVATE_KEY_BASE64 }}
          MADRASADZ_ASC_KEY_ID: ${{ secrets.MADRASADZ_ASC_KEY_ID }}
          MADRASADZ_ASC_ISSUER_ID: ${{ secrets.MADRASADZ_ASC_ISSUER_ID }}
        run: bash platform/ios/scripts/upload-testflight.sh "$RUNNER_TEMP/madrasadz-approved-ipa/Madrasadz.ipa"

# Owner-approved internal replacement. Pinned signed Build 7 artifact 12743022733
# (source deb03f6, signed run 40525444553). Unsigned run 40525444544 on the same
# source passed Debug/Release, the public foreground test in light and dark, and the
# core package (planner tests) + native UI. No rebuild, new invitation, App Review
# submission or release.
