name: iOS — Build 14 TestFlight upload

on:
  workflow_dispatch:
  push:
    branches: [codex/ios-app-foundation]
    paths: ['.github/workflows/ios-testflight-upload.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-testflight-build-14-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'ohaigoune-debug/nova-pdf-studio' && (github.ref == 'refs/heads/codex/ios-app-foundation' || github.ref == 'refs/heads/claude/native-ios-full' || github.ref == 'refs/heads/claude/ios-build14') && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the owner-approved successful signed IPA
        uses: actions/download-artifact@v4
        with:
          name: Madrasadz-signed-IPA-d2e6f36f28b99612a0e1afc98717f8a48b4fdd71
          run-id: 41707676769
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/madrasadz-approved-ipa
      - name: Validate and upload Build 14 to Apple
        env:
          MADRASADZ_ASC_PRIVATE_KEY_BASE64: ${{ secrets.MADRASADZ_ASC_PRIVATE_KEY_BASE64 }}
          MADRASADZ_ASC_KEY_ID: ${{ secrets.MADRASADZ_ASC_KEY_ID }}
          MADRASADZ_ASC_ISSUER_ID: ${{ secrets.MADRASADZ_ASC_ISSUER_ID }}
        run: bash platform/ios/scripts/upload-testflight.sh "$RUNNER_TEMP/madrasadz-approved-ipa/Madrasadz.ipa"

# Owner-approved internal replacement (owner's word «اذمج وارفع وانشر», 3 Nov 2026). Pinned signed
# Build 14 (signed run 41707676769 on d2e6f36): Home with four doors, step-by-step BAC and tests
# banks, the planner's suggested week. Same app source: core package, Debug/Release and the native
# UI tests of Home, banks, sign-up, phone and PLAY passed (ios-native-check.yml runs 41704083700,
# 41707637129); two UI test scripts are being fixed (scrolling, notification permission prompt).
# Owner-only internal group; no new invitation, App Review submission or release.
