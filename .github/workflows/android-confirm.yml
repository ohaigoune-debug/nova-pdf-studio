name: تطبيق التأكيد (أندرويد)

# يتحقق أن تطبيق عامل التأكيد يُبنى، ويرفع APK تجريبيًا (debug) للتجربة.
# النسخة الموقّعة للعمّال تُبنى على الخادم: bash scripts/build-android-confirm.sh
on:
  workflow_dispatch:
  push:
    paths:
      - 'platform/android-confirm/**'
      - '.github/workflows/android-confirm.yml'

defaults:
  run:
    working-directory: platform/android-confirm

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: أدوات أندرويد
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" >/dev/null

      - name: بناء نسخة تجريبية
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: madrasa-confirm-debug
          path: platform/android-confirm/app/build/outputs/apk/debug/*.apk
          retention-days: 7
