# Render Blueprint — نشر بضغطة زر (Web Service + PostgreSQL)
# https://render.com/deploy?repo=https://github.com/ohaigoune-debug/nova-pdf-studio
#
# هذا الملف للتجربة: SEED_DEMO=1 يزرع حسابات كلمات سرّها منشورة في README.
# للإطلاق الحقيقي على نطاقك: احذف SEED_DEMO وأضف ADMIN_EMAIL و ADMIN_PASSWORD
# (سرّيتين من لوحة Render لا من هذا الملف) — انظر platform/docs/DEPLOYMENT.md
services:
  - type: web
    name: madrasa
    runtime: node
    rootDir: platform
    branch: main
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:hosted
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: madrasa-db
          property: connectionString
      - key: AUTO_MIGRATE
        value: '1'
      - key: SEED_DEMO
        value: '1'
      - key: SESSION_SECRET
        generateValue: true
      - key: QR_TOKEN_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: madrasa
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_PROVIDER
        value: mock
      - key: MAIL_PROVIDER
        value: console
      - key: STORAGE_DRIVER
        value: local
      - key: UPLOADS_DIR
        value: /tmp/uploads
      - key: JOBS_INLINE_WORKER
        value: '1'
      # تطبيق أندرويد: البصمة تُضاف يدوياً بعد أول بناء موقّع
      - key: ANDROID_PACKAGE_NAME
        value: dz.madrasa.app
      - key: ANDROID_CERT_FINGERPRINTS
        sync: false

databases:
  - name: madrasa-db
    plan: free
    databaseName: madrasa
    user: madrasa
